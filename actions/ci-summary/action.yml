# Deprecated: this action moved to https://github.com/pieceofcake2/ci-summary.
# This wrapper keeps `pieceofcake2/.github/actions/ci-summary@master` working by calling
# pieceofcake2/ci-summary@v1 with the same inputs. Use pieceofcake2/ci-summary@v1 directly.
name: CI summary (moved to pieceofcake2/ci-summary)
description: Deprecated. Use pieceofcake2/ci-summary@v1 instead; this wrapper calls it with the same inputs.
author: Piece of Cake 2

inputs:
  type:
    description: 'Report type: junit (PHPUnit or any JUnit XML), checkstyle (phpcs) or phpstan (JSON or checkstyle output).'
    required: true
  file:
    description: Path to the report.
    required: true
  title:
    description: Heading of the summary, e.g. "PHPUnit — PHP 8.4 / mysql".
    required: false
    default: ''
  coverage:
    description: Optional Clover coverage report, for type junit.
    required: false
    default: ''
  artifact-name:
    description: For type junit. Name of an artifact of the run with files of the failed tests, e.g. E2E screenshots. When tests failed, the summary adds a line that links to it.
    required: false
    default: ''
  artifact-note:
    description: For type junit. Text of that line; {artifact} is replaced with the linked artifact name.
    required: false
    default: 'Screenshots, logs and other files of the failed tests are in the {artifact} artifact.'

runs:
  using: composite
  steps:
    - name: Write job summary
      uses: pieceofcake2/ci-summary@v1
      with:
        type: ${{ inputs.type }}
        file: ${{ inputs.file }}
        title: ${{ inputs.title }}
        coverage: ${{ inputs.coverage }}
        artifact-name: ${{ inputs.artifact-name }}
        artifact-note: ${{ inputs.artifact-note }}
